[project]
name = "numervia-backend"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi",
  "pydantic",
  "uvicorn",
  "mangum",
  "httpx",
  "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
